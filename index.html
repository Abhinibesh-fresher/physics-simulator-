<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070b14" />
<title>Class 10 Physics Simulator</title>
<link rel="stylesheet" href="style.css?v=8" />
</head>
<body>

<!-- ==================================================================
     APP SHELL
     ================================================================== -->
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1 id="appTitle">Class 10 Physics Simulator</h1>
        <p class="brand-sub">NCERT · New Cartesian Sign Convention</p>
      </div>
    </div>

    <!-- Dark / light mode toggle -->
    <button id="themeBtn" class="theme-btn" type="button" aria-label="Switch colour mode">
      <span class="theme-icon" aria-hidden="true">☾</span>
      <span class="theme-label">Dark</span>
    </button>
  </header>

  <!-- ==================================================================
       HOME SCREEN — topic cards
       ================================================================== -->
  <main id="home" class="home">
    <p class="home-lead">
      Pick a chapter. Every simulation uses the exact formulas from the CBSE syllabus —
      drag things around and watch the numbers agree.
    </p>

    <div class="cards" id="cards">
      <!-- Cards are generated by script.js from the topic list -->
    </div>

    <!-- Home credit line: the name comes from CREDIT in script.js -->
    <p class="home-credit" id="homeCredit"></p>
  </main>

  <!-- ==================================================================
       SIMULATOR VIEW — swapped in when a topic is opened
       ================================================================== -->
  <main id="viewer" class="viewer" hidden>

    <div class="viewer-head">
      <button id="backBtn" class="btn btn-ghost btn-small" type="button">← All topics</button>
      <div class="viewer-title">
        <h2 id="viewTitle">—</h2>
        <p id="viewBlurb"></p>
      </div>
      <button id="resetBtn" class="btn btn-ghost btn-small" type="button">Reset</button>
    </div>

    <div class="sim-grid">
      <!-- Canvas -->
      <section class="card canvas-card">
        <div class="canvas-wrap">
          <canvas id="sim" aria-label="Physics simulation canvas"></canvas>
        </div>
        <p class="sim-note" id="simNote"></p>
      </section>

      <!-- Controls + live readouts -->
      <section class="card controls-card">
        <h3 class="card-title">Controls</h3>
        <div id="controls" class="controls"></div>
        <div class="readouts" id="readouts"></div>
      </section>
    </div>

    <!-- Formula + Learn panels -->
    <div class="panels">
      <section class="card">
        <h3 class="card-title">Formulas</h3>
        <div id="formulas" class="formula-list"></div>
      </section>
      <section class="card">
        <h3 class="card-title">Learn</h3>
        <ul id="learn" class="learn-list"></ul>
      </section>

      <!-- Practice: questions built from the current slider values -->
      <section class="card">
        <div class="quiz-head">
          <h3 class="card-title">Practice</h3>
          <button id="newQuestions" class="btn btn-ghost btn-tiny" type="button">New questions</button>
        </div>
        <div id="quiz" class="quiz"></div>
      </section>
    </div>
  </main>
</div>

<!-- ==================================================================
     WATERMARK
     ------------------------------------------------------------------
     Fixed credit line. To change the name, edit the text inside the
     #watermark div below. Its styling lives in one section of style.css
     (search for "WATERMARK").
     ================================================================== -->
<div id="watermark" aria-hidden="true">Abhinibesh-fresher</div>
<!-- ==================== end of watermark ==================== -->

<script src="script.js?v=8"></script>
</body>
    </html>
